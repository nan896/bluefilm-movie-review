<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理 · 蓝影</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header admin-header">
    <div class="header-inner">
        <a class="brand" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2l2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>
            </svg>
            <span>蓝影管理</span>
        </a>
        <nav class="main-nav">
            <a href="/">返回网站</a>
            <a class="active" href="/admin.html">电影管理</a>
        </nav>
        <div id="user-area" class="user-area"></div>
    </div>
</header>

<main class="container admin-page">
    <section id="admin-login" class="admin-login">
        <div>
            <p class="section-kicker">管理员入口</p>
            <h1>登录后管理电影内容</h1>
            <p>默认管理员账号为 <strong>admin / admin123</strong>。</p>
        </div>
        <form id="admin-login-form" class="login-panel">
            <label>
                <span>用户名</span>
                <input id="admin-username" type="text" value="admin" required>
            </label>
            <label>
                <span>密码</span>
                <input id="admin-password" type="password" value="admin123" required>
            </label>
            <p id="admin-login-message" class="form-message"></p>
            <button class="button primary full" type="submit">进入管理台</button>
        </form>
    </section>

    <section id="admin-dashboard" hidden>
        <div class="admin-title-row">
            <div>
                <p class="section-kicker">内容管理</p>
                <h1>电影与评论概览</h1>
            </div>
            <a class="button ghost" href="/">查看网站</a>
        </div>
        <div class="stats-grid" id="stats-grid"></div>

        <div class="admin-workspace">
            <section class="movie-editor">
                <div class="panel-heading">
                    <span id="editor-title">添加电影</span>
                    <button id="cancel-edit" class="text-button" type="button" hidden>取消编辑</button>
                </div>
                <form id="movie-form" class="movie-form">
                    <input id="movie-db-id" type="hidden">
                    <label><span>电影名称</span><input id="movie-title" type="text" required></label>
                    <label><span>英文名</span><input id="movie-original-title" type="text"></label>
                    <div class="form-pair">
                        <label><span>年份</span><input id="movie-year" type="number" min="1888" max="2100" required></label>
                        <label><span>片长（分钟）</span><input id="movie-duration" type="number" min="1"></label>
                    </div>
                    <label><span>类型</span><input id="movie-type" type="text" placeholder="剧情 / 喜剧" required></label>
                    <label><span>地区</span><input id="movie-region" type="text"></label>
                    <label><span>导演</span><input id="movie-director" type="text"></label>
                    <label><span>主演</span><input id="movie-actors" type="text"></label>
                    <label><span>海报地址</span><input id="movie-poster" type="text" value="/assets/posters/poster-1.jpg"></label>
                    <label><span>简介</span><textarea id="movie-summary" rows="4"></textarea></label>
                    <div class="form-pair">
                        <label><span>评分</span><input id="movie-rating" type="number" min="0" max="10" step="0.1" value="8.0"></label>
                        <label><span>浏览数</span><input id="movie-views" type="number" min="0" value="0"></label>
                    </div>
                    <label class="checkbox-label">
                        <input id="movie-featured" type="checkbox">
                        <span>设为首页推荐</span>
                    </label>
                    <p id="movie-form-message" class="form-message"></p>
                    <button class="button primary full" type="submit">保存电影</button>
                </form>
            </section>

            <section class="movie-table-panel">
                <div class="panel-heading">
                    <span>全部电影</span>
                    <button id="refresh-movies" class="text-button" type="button">刷新</button>
                </div>
                <div class="table-scroll">
                    <table class="movie-table">
                        <thead>
                        <tr>
                            <th>电影</th>
                            <th>年份</th>
                            <th>评分</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="admin-movie-list"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </section>
</main>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
